name: APT-Repository

# Baut das Debian-Paket und veröffentlicht es als signiertes APT-Repository
# im Branch gh-pages. Clients installieren danach mit 'apt-get install rsynbacktux'.
#
# Voraussetzungen (einmalig im Repository einzurichten):
#   1. Secret GPG_PRIVATE_KEY  – privater Signierschlüssel, ASCII-armiert
#      (gpg --armor --export-secret-keys <KEY-ID>)
#   2. Secret GPG_PASSPHRASE   – Passphrase des Schlüssels (leer, falls keine)
#   3. Settings > Pages > Source: Branch 'gh-pages', Ordner '/'
#
# Ohne Schlüssel läuft der Workflow trotzdem durch: Das Repository wird gebaut
# und als Artefakt hinterlegt, aber nicht veröffentlicht – ein unsigniertes
# APT-Repository wäre für die Clients nicht überprüfbar.

permissions:
  contents: write
  pages: read

on:
  release:
    types: [published]
  workflow_dispatch:
  # Wird von release.yml direkt aufgerufen. Nötig, weil ein von GITHUB_TOKEN
  # erzeugtes Release absichtlich keine weiteren Workflows auslöst – ohne den
  # direkten Aufruf bliebe das Repository beim automatischen Release stehen.
  workflow_call:

concurrency:
  group: apt-repo
  cancel-in-progress: false

env:
  SUITE: stable
  COMPONENT: main
  ARCHITECTURES: "all amd64 arm64 armhf i386"

jobs:
  publish:
    name: Repository bauen und veröffentlichen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev

      - name: Build Debian package
        run: scripts/build-deb.sh dist

      - name: Signierschlüssel vorhanden?
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Auch ein Secret, das nur Leerzeichen oder Zeilenumbrüche enthält,
          # gilt als nicht gesetzt – sonst scheitert erst das Signieren.
          if [ -n "$(printf '%s' "${GPG_PRIVATE_KEY-}" | tr -d '[:space:]')" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret GPG_PRIVATE_KEY fehlt – das APT-Repository wird gebaut, aber nicht veröffentlicht."
          fi

      # Bestehenden Stand holen, damit ältere Versionen im Pool erhalten bleiben.
      # Beim allerersten Lauf gibt es den Branch noch nicht; das ist kein Fehler.
      - name: Bestehendes APT-Repository holen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
            # Token nicht in der Konfiguration liegen lassen
            git -C repo remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            echo "Bestehenden Stand aus gh-pages übernommen."
          else
            echo "Branch gh-pages existiert noch nicht – wird mit diesem Lauf angelegt."
            mkdir -p repo
          fi

      - name: Repository-Struktur aufbauen
        run: |
          set -euo pipefail
          mkdir -p "repo/pool/${COMPONENT}/r/rsynbacktux"
          cp dist/*.deb "repo/pool/${COMPONENT}/r/rsynbacktux/"
          touch repo/.nojekyll

          cd repo
          # Ein Index für alle Architekturen: Das Paket ist Architecture: all.
          dpkg-scanpackages --multiversion "pool/${COMPONENT}" > "${RUNNER_TEMP}/Packages"
          for arch in ${ARCHITECTURES}; do
            dir="dists/${SUITE}/${COMPONENT}/binary-${arch}"
            mkdir -p "$dir"
            cp "${RUNNER_TEMP}/Packages" "${dir}/Packages"
            gzip -9nc "${dir}/Packages" > "${dir}/Packages.gz"
          done
          echo "Indiziert:"
          grep -E "^(Package|Version|Filename):" "${RUNNER_TEMP}/Packages" || true

      - name: Release-Datei erzeugen
        run: |
          set -euo pipefail
          cd repo
          rm -f "dists/${SUITE}/Release" "dists/${SUITE}/InRelease" "dists/${SUITE}/Release.gpg"
          # Erst in eine temporäre Datei schreiben: läge die Release-Datei schon
          # im Verzeichnis, würde apt-ftparchive sie in sich selbst hashen.
          apt-ftparchive \
            -o "APT::FTPArchive::Release::Origin=rSynBackTux" \
            -o "APT::FTPArchive::Release::Label=rSynBackTux" \
            -o "APT::FTPArchive::Release::Suite=${SUITE}" \
            -o "APT::FTPArchive::Release::Codename=${SUITE}" \
            -o "APT::FTPArchive::Release::Components=${COMPONENT}" \
            -o "APT::FTPArchive::Release::Architectures=${ARCHITECTURES}" \
            -o "APT::FTPArchive::Release::Description=rSynBackTux – Synology Remote Backup for Linux Servers" \
            release "dists/${SUITE}" > "${RUNNER_TEMP}/Release"
          mv "${RUNNER_TEMP}/Release" "dists/${SUITE}/Release"
          head -20 "dists/${SUITE}/Release"

      - name: Release signieren
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          key="$GPG_PRIVATE_KEY"
          armor='-----BEGIN PGP PRIVATE KEY BLOCK-----'
          armor_end='-----END PGP PRIVATE KEY BLOCK-----'

          # Legt den Schlüssel so hin, wie gpg ihn erwartet: ohne UTF-8-BOM
          # (das hängt eine PowerShell-Pipe unter Windows gern davor und gpg
          # lehnt den Block dann ab), ohne CR aus CRLF und ohne alles, was vor
          # oder hinter dem Block steht.
          normalize() {
            tr -d '\r' \
              | sed '1s/^\xEF\xBB\xBF//' \
              | sed -n "/${armor}/,/${armor_end}/p"
          }

          if printf '%s\n' "$key" | grep -qF -- "$armor"; then
            key="$(printf '%s\n' "$key" | normalize)"
          else
            # Manche legen den Export base64-kodiert ab – das nehmen wir auch an.
            if decoded="$(printf '%s' "$key" | tr -d '[:space:]' | base64 -d 2>/dev/null)" &&
               printf '%s\n' "$decoded" | grep -qF -- "$armor"; then
              key="$(printf '%s\n' "$decoded" | normalize)"
              echo "Secret war base64-kodiert und wurde dekodiert."
            else
              echo "::error::Das Secret GPG_PRIVATE_KEY enthält keinen ASCII-armierten privaten Schlüssel."
              echo "Erwartet wird die vollständige Ausgabe von:" >&2
              echo "    gpg --armor --export-secret-keys <KEY-ID>" >&2
              echo "einschließlich der Zeilen '${armor}' und '${armor_end}'." >&2
              echo "" >&2
              echo "Häufige Ursachen:" >&2
              echo "  * '--export' statt '--export-secret-keys' benutzt (öffentlicher Schlüssel)" >&2
              echo "  * die KEY-ID passte nicht, gpg gab 'nothing exported' und damit nichts aus" >&2
              echo "  * beim Kopieren gingen die Zeilenumbrüche verloren" >&2
              exit 1
            fi
          fi

          # Abschließender Zeilenumbruch: ohne ihn lehnen manche gpg-Versionen
          # den Armor-Block ab.
          if ! printf '%s\n' "$key" | gpg --batch --import; then
            echo "::error::Der private Schlüssel ließ sich nicht importieren – der Armor-Block ist beschädigt."
            echo "Der Block ist zwar vorhanden, gpg kann ihn aber nicht lesen. Am ehesten ist" >&2
            echo "der Inhalt beim Kopieren einzeilig geworden oder anders umkodiert worden." >&2
            echo "Zuverlässig geht es über eine Datei:" >&2
            echo "    gpg --armor --export-secret-keys <KEY-ID> > key.asc" >&2
            echo "    gh secret set GPG_PRIVATE_KEY --repo ${GITHUB_REPOSITORY} < key.asc" >&2
            exit 1
          fi

          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
          if [ -z "$KEY_ID" ]; then
            echo "::error::Es wurde kein privater Schlüssel importiert – das Secret enthält offenbar nur öffentliches Schlüsselmaterial. Bitte 'gpg --armor --export-secret-keys <KEY-ID>' verwenden."
            exit 1
          fi
          echo "Signiere mit ${KEY_ID}"

          cd repo
          if ! gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" \
              --local-user "$KEY_ID" --clearsign \
              --output "dists/${SUITE}/InRelease" "dists/${SUITE}/Release"; then
            echo "::error::Signieren fehlgeschlagen. Ist der Schlüssel mit einer Passphrase geschützt?"
            echo "Dann muss sie zusätzlich als Secret GPG_PASSPHRASE hinterlegt werden:" >&2
            echo "    gh secret set GPG_PASSPHRASE --repo ${GITHUB_REPOSITORY}" >&2
            echo "" >&2
            echo "Alternativ die Passphrase vom Schlüssel entfernen und neu exportieren:" >&2
            echo "    gpg --edit-key <KEY-ID>   # dort: passwd, neue Passphrase leer lassen, save" >&2
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" \
            --local-user "$KEY_ID" --detach-sign --armor \
            --output "dists/${SUITE}/Release.gpg" "dists/${SUITE}/Release"

          # Gegenprobe: Was die Clients später prüfen, prüfen wir hier auch.
          if ! gpg --verify "dists/${SUITE}/InRelease" >/dev/null 2>&1; then
            echo "::error::Die erzeugte InRelease-Signatur lässt sich nicht verifizieren."
            exit 1
          fi
          echo "Signatur geprüft."

          # Öffentlicher Schlüssel für /etc/apt/keyrings/
          gpg --export "$KEY_ID" > rsynbacktux-archive-keyring.gpg
          gpg --armor --export "$KEY_ID" > rsynbacktux-archive-keyring.asc
          rm -rf "$GNUPGHOME"

      # Die Adresse steht nicht fest: Mit einer eigenen Domain liefert Pages das
      # Repository unter dieser aus, nicht unter <owner>.github.io. Die Pages-API
      # kennt die tatsächliche Adresse, deshalb fragen wir sie dort ab.
      - name: Repository-Adresse bestimmen
        id: url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ vars.APT_REPO_URL }}
        run: |
          set -uo pipefail
          url="$OVERRIDE"

          if [ -z "$url" ]; then
            url="$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" \
              | jq -r '.html_url // empty')" || url=""
          fi

          if [ -z "$url" ]; then
            # Pages noch nicht eingerichtet: Standardadresse annehmen.
            owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            url="https://${owner}.github.io/${GITHUB_REPOSITORY##*/}"
            echo "Pages-Adresse nicht abrufbar, nehme Standard an."
          fi

          url="${url%/}"

          # Die Pages-API meldet http://, solange für eine eigene Domain kein
          # HTTPS erzwungen ist. Ein APT-Repository über Klartext-HTTP gibt
          # jedem Mitleser preis, was installiert wird – GitHub liefert die
          # Seite ohnehin auch über TLS aus.
          url="${url/#http:\/\//https://}"

          echo "Repository-Adresse: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Startseite schreiben
        env:
          REPO_URL: ${{ steps.url.outputs.url }}
        run: |
          set -euo pipefail
          cat > repo/index.html <<HTML
          <!doctype html>
          <html lang="de">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>rSynBackTux – APT-Repository</title>
          <style>
            body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 2rem auto;
                   padding: 0 1rem; line-height: 1.6; }
            pre { background: #11111b; color: #eee; padding: 1rem; overflow-x: auto;
                  border-radius: .4rem; }
            code { font-family: ui-monospace, monospace; }
          </style>
          </head>
          <body>
          <h1>rSynBackTux – APT-Repository</h1>
          <p>Backups von Linux-Servern auf eine Synology NAS.
             <a href="https://github.com/${GITHUB_REPOSITORY}">Projektseite</a></p>
          <h2>Einrichten</h2>
          <pre><code>sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL ${REPO_URL}/rsynbacktux-archive-keyring.asc \\
            | sudo gpg --dearmor -o /etc/apt/keyrings/rsynbacktux.gpg

          echo "deb [signed-by=/etc/apt/keyrings/rsynbacktux.gpg] ${REPO_URL} ${SUITE} ${COMPONENT}" \\
            | sudo tee /etc/apt/sources.list.d/rsynbacktux.list

          sudo apt-get update
          sudo apt-get install rsynbacktux</code></pre>
          <h2>Einrichten der Sicherung</h2>
          <pre><code>sudo rsynbacktux-setup</code></pre>
          <p>Konfiguration danach in <code>/etc/rsynbacktux/backup.conf</code>,
             Details in <code>man rsynbacktux-setup</code>.</p>
          </body>
          </html>
          HTML

      - name: Veröffentlichen
        if: steps.gpg.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd repo
          if [ ! -d .git ]; then
            git init -q -b gh-pages
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Repository."
            exit 0
          fi
          git commit -q -m "APT-Repository: ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      - name: Repository als Artefakt sichern
        uses: actions/upload-artifact@v7
        with:
          name: apt-repo
          path: |
            repo
            !repo/.git
          if-no-files-found: error

      - name: Hinweis ohne Signierschlüssel
        if: steps.gpg.outputs.available != 'true'
        run: |
          {
            echo "## APT-Repository nicht veröffentlicht"
            echo ""
            echo "Das Secret \`GPG_PRIVATE_KEY\` fehlt. Ein unsigniertes APT-Repository"
            echo "können die Clients nicht überprüfen, deshalb wurde nichts gepusht."
            echo ""
            echo "Einrichtung:"
            echo ""
            echo '```bash'
            echo "gpg --quick-generate-key 'rSynBackTux Repository <noreply@example.com>' rsa4096 sign never"
            echo "gpg --armor --export-secret-keys <KEY-ID>   # -> Secret GPG_PRIVATE_KEY"
            echo '```'
            echo ""
            echo "Danach in Settings > Pages als Quelle den Branch \`gh-pages\` wählen."
          } >> "$GITHUB_STEP_SUMMARY"
