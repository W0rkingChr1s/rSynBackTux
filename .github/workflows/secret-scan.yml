name: Secret Scan
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  trufflehog:
    name: Scan repo for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # komplette History für TruffleHog

      - name: Secret scanning with TruffleHog
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          extra_args: --results=verified,unknown
