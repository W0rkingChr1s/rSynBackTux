name: Release
permissions:
  contents: write
  pull-requests: write
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF##*/}"        # z.B. v1.0.2
          VERSION="${TAG_NAME#v}"             # z.B. 1.0.2
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using TAG_NAME=${TAG_NAME}, VERSION=${VERSION}"

      - name: Create dist bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src/install-syno-backup.sh dist/
          cp src/uninstall-syno-backup.sh dist/
          for f in README.md CHANGELOG.md LICENSE VERSION; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          # Archiv außerhalb von dist/ erzeugen, sonst packt tar sich selbst mit ein
          tar czf "rSynBackTux-${{ steps.vars.outputs.version }}.tar.gz" -C dist .
          mv "rSynBackTux-${{ steps.vars.outputs.version }}.tar.gz" dist/
          ls -l dist

      - name: Build Debian package
        run: |
          set -euo pipefail
          # Der Tag gibt die Version vor; sonst hieße das Paket anders als das Release.
          if [ "$(cat VERSION)" != "${{ steps.vars.outputs.version }}" ]; then
            echo "VERSION ($(cat VERSION)) passt nicht zum Tag (${{ steps.vars.outputs.version }})."
            exit 1
          fi
          scripts/build-deb.sh dist
          ls -l dist/*.deb

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "rSynBackTux v${{ steps.vars.outputs.version }}"
          draft: false
          prerelease: false
          files: |
            dist/install-syno-backup.sh
            dist/uninstall-syno-backup.sh
            dist/rSynBackTux-${{ steps.vars.outputs.version }}.tar.gz
            dist/rsynbacktux_${{ steps.vars.outputs.version }}-1_all.deb
          body: |
            Automated release for tag ${{ steps.vars.outputs.tag_name }}.

            **Debian/Ubuntu:**

            ```bash
            sudo apt-get install ./rsynbacktux_${{ steps.vars.outputs.version }}-1_all.deb
            sudo rsynbacktux-setup
            ```

            Oder über das APT-Repository (siehe README).

            Siehe CHANGELOG.md im Repository für Details.
